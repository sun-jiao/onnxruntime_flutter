name: Native regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/run_web_tests.py
      - run: flutter build web --release
        working-directory: example

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: example

  apple-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --release --no-codesign
        working-directory: example
      - run: flutter build macos --release
        working-directory: example

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test build selection, binary versions and test runner
        run: python -m unittest discover -s test/packaging -v
      - name: Check reproducible model fixtures
        run: |
          python test/fixtures/generate_complex_outputs.py
          git diff --exit-code -- test/fixtures

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: pinned
          - os: ubuntu-24.04-arm
            runtime: pinned
          - os: windows-2022
            runtime: pinned
          - os: macos-15
            runtime: pinned
          - os: ubuntu-24.04
            runtime: '1.23.2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux engine dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          # Linux ARM64 has no matching SDK archive. The master channel input
          # selects Git installation, then checks out the exact version above.
          channel: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' && 'master' || 'stable' }}
          cache: true
      - run: flutter pub get
      - name: Analyze library and tests
        run: flutter analyze --no-fatal-infos lib test
      - name: Fetch and test pinned runtime
        if: matrix.runtime == 'pinned'
        run: python tool/run_native_tests.py
      - name: Test macOS runtime version on Linux host
        if: matrix.runtime == '1.23.2'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-1.23.2.tgz"
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz \
            --output "$archive"
          echo "1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          runtime_dir="$RUNNER_TEMP/onnxruntime-linux-x64-1.23.2/lib"
          ln -s libonnxruntime.so.1.23.2 "$runtime_dir/libonnxruntime.so.1.30.0"
          python tool/run_native_tests.py --runtime-dir "$runtime_dir" --runtime-version 1.23.2
